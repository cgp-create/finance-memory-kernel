[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-memory-kernel"
version = "0.2.0"
description = "Provenance-preserving, revision-aware research-and-decision record for investment agents. SQLite and the standard library only."
readme = "README.md"
authors = [{name = "Carlos Pereira"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fmk = ["data/fixtures/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
